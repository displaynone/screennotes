name: Build packages

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: DEB and AppImage (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.94.1
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag} must match Cargo.toml version v{version}")
          PYTHON

      - name: Install native build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            install -y --no-install-recommends \
            build-essential ca-certificates curl pkg-config libgtk-4-dev \
            librsvg2-dev libgirepository1.0-dev libgdk-pixbuf2.0-bin \
            adwaita-icon-theme dpkg-dev desktop-file-utils python3 file \
            patchelf squashfs-tools zsync

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Build DEB and AppImage directly on Ubuntu 24.04
        run: python3 scripts/package.py all

      - name: Verify packages
        run: |
          cd dist
          sha256sum --check -- *.sha256
          dpkg-deb --info ./*.deb
          dpkg-deb --extract ./*.deb "$RUNNER_TEMP/screennotes-deb"
          "$RUNNER_TEMP/screennotes-deb/usr/bin/screennotes" --help
          ./*.AppImage --appimage-extract-and-run --help

      - name: Upload Debian package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screennotes-deb-amd64
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*.deb.build.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screennotes-appimage-x86_64
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*.AppImage.build.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: packages
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: screennotes-*
          merge-multiple: true
          path: dist

      - name: Verify downloaded checksums
        working-directory: dist
        run: sha256sum --check -- *.sha256

      - name: Publish installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --generate-notes \
            --title "ScreenNotes $RELEASE_TAG" "${flags[@]}"
